<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/my-fav-page.css">
    <script src="js/main-app.js" defer></script>
    <script src="js/myfav-app.js" defer></script>
    <title>Premier League</title>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <nav class="navigator">
            <div class="top-nav">
                <div class="brand">
                    <span class="brand-title">Premier League</span>
                    <span class="brand-subtitle">Analytics</span>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="teams.html">Teams</a></li>
                    <li><a href="players.html">Players</a></li>
                    <li><a href="matches.html">Matches</a></li>
                    <li><a href="analytics.html">Analytics</a></li>
                    <li><a href="compare.html">Compare</a></li>
                    <li><a href="standing.html">Standing</a></li>
                    <li><a href="my_fav.html" class="active">My Favorites</a></li>
                </ul>
            </div>
            <div class="bottom-nav" hidden>
                <a href="#" class="btn-logout">
                    <img src="assets/logout.svg" alt="icon-logout">
                    Log out
                </a>
            </div>
        </nav>

        <!-- Content Area -->
        <div class="content-wrapper">
            <header class="header">
                <div class="left-header">
                    <h1>My Favorites</h1>
                </div>

                <div class="right-header">
                    <form action="search.html" method="GET" class="search-form">
                        <input type="search" name="q" id="search" placeholder="Search">
                    </form>
                    <div class="profile" hidden>
                        <div class="photo-profile">
                            <img src="assets/img.png" alt="photo">
                        </div>
                        <div class="info-profile">
                            <p class="name">Username</p>
                            <p class="role">member</p>
                        </div>
                    </div>
                    <a href="login.html" id="btn-login">Log in</a>
                </div>
            </header>

            <!-- Main Content -->
            <main class="main">
                <div class="main-content">
                    <!-- Category Filter Tabs -->
                    <div class="filter-tabs">
                        <button type="button" class="tab-btn active" data-filter="teams">Favorite Teams</button>
                        <button type="button" class="tab-btn" data-filter="players">Favorite Players</button>
                    </div>

                    <!-- Favorites Grid (จะถูกแทนที่ด้วยข้อมูลจริงจาก JS) -->
                    <div class="fav-content">
                        <div class="fav-card team">
                            <svg class="heart-icon" width="50" height="50" viewBox="0 0 24 24" fill="red" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                            <img class="fav-photo" src="assets/img.jpg" alt="fav-photo">
                            <div class="info team">
                                <p class="team-name">Nottingham Forest</p>
                                <p class="stadium">Stadium</p>
                            </div>
                        </div>

                        <div class="fav-card player" hidden>
                            <svg class="heart-icon" width="50" height="50" viewBox="0 0 24 24" fill="red" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                            <img class="fav-photo" src="assets/img.jpg" alt="fav-photo">
                            <div class="info player">
                                <p class="player-name">Mohamed Salah</p>
                                <p class="player-detail">Liverpool • Forward</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
