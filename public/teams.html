<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/layout.css">
    <script src="js/main-app.js" defer></script>
    <link rel="stylesheet" href="css/teams.css">
    <script src="js/teams.js" defer></script>
    <title>Premier League</title>
</head>

<body>

    <div class="container">
        <nav class="navigator">
            <div class="top-nav">
                <div class="brand">
                    <h1>
                        Premier League
                        <p>Analytics</p>
                    </h1>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="teams.html" class="active">Teams</a></li>
                    <li><a href="players.html">Players</a></li>
                    <li><a href="matches.html">Matches</a></li>
                    <li><a href="analytics.html">Analytics</a></li>
                    <li><a href="compare.html">Compare</a></li>
                    <li><a href="summary.html">Summary</a></li>
                    <li><a href="my_fav.html">My Favorites</a></li>
                </ul>
            </div>
            <div class="bottom-nav" hidden>
                <a href="#" class="btn-logout">
                    <img src="assets/logout.svg" alt="icon-logout">
                    Log out
                </a>
            </div>
        </nav>

        <div class="content-wrapper">
            <header class="header">
                <div class="left-header">
                    <h2>Teams</h2>
                </div>

                <div class="right-header">
                    <form action="search.html" method="GET" class="search-form">
                        <input type="search" name="search" id="search" placeholder="Search">
                    </form>
                    <div class="profile" hidden>
                        <div class="photo-profile">
                            <img src="assets/img.png" alt="photo">
                        </div>
                        <div class="info-profile">
                            <p class="name">Username</p>
                            <p class="role">member</p>
                        </div>
                    </div>
                    <a href="login.html" id="btn-login">Log in</a>
                </div>
            </header>
            <main class="main">
                <div class="team-filters">
                    <input id="team-search" type="search" placeholder="Search teams..." aria-label="Search teams">

                    <select id="team-season" aria-label="Season"></select>

                    <select id="stadium-filter" aria-label="Stadium">
                        <option value="">All stadiums</option>
                    </select>

                    <select id="city-filter" aria-label="City">
                        <option value="">All cities</option>
                    </select>

                    <button id="team-favorites" type="button" aria-pressed="false">
                        My Favorites
                    </button>
                </div>

                <p id="team-status" role="status">กำลังโหลดข้อมูลทีม...</p>
                <button id="team-retry" type="button" hidden>ลองอีกครั้ง</button>

                <div class="standings-scroll">
                    <table class="standings" aria-label="สถิติทีมในฤดูกาลที่เลือก">
                        <thead>
                            <tr>
                                <th scope="col">ทีม</th>
                                <th scope="col">แข่ง</th>
                                <th scope="col">ชนะ</th>
                                <th scope="col">เสมอ</th>
                                <th scope="col">แพ้</th>
                                <th scope="col">ได้</th>
                                <th scope="col">เสีย</th>
                                <th scope="col">ต่าง</th>
                                <th scope="col">แต้ม</th>
                                <th scope="col">โปรด</th>
                            </tr>
                        </thead>
                        <tbody id="team-grid"></tbody>
                    </table>
                </div>
                <dialog id="team-dialog" aria-labelledby="team-detail-name">
                    <h2 id="team-detail-name"></h2>
                    <p id="team-detail-info"></p>
                    <dl id="team-detail-stats"></dl>
                    <form method="dialog">
                        <button type="submit">Close</button>
                    </form>
                </dialog>
            </main>

        </div>

    </div>
</body>

</html>
