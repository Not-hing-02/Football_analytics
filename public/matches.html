<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/layout.css">
    <script src="js/main-app.js" defer></script>
    <link rel="stylesheet" href="css/matches.css">
    <script src="js/matches.js" defer></script>
    <title>Premier League</title>
</head>

<body>

    <div class="container">
        <nav class="navigator">
            <div class="top-nav">
                <div class="brand">
                    <span class="brand-title">Premier League</span>
                    <span class="brand-subtitle">Analytics</span>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="teams.html">Teams</a></li>
                    <li><a href="players.html">Players</a></li>
                    <li><a href="matches.html" class="active">Matches</a></li>
                    <li><a href="analytics.html">Analytics</a></li>
                    <li><a href="compare.html">Compare</a></li>
                    <li><a href="standing.html">Standing</a></li>
                    <li><a href="my_fav.html">My Favorites</a></li>
                </ul>
            </div>
            <div class="bottom-nav" hidden>
                <button type="button" class="btn-logout">
                    <img src="assets/logout.svg" alt="icon-logout">
                    Log out
                </button>
            </div>
        </nav>

        <div class="content-wrapper">
            <header class="header">
                <div class="left-header">
                    <h1>Matches</h1>
                </div>

                <div class="right-header">
                    <form action="search.html" method="GET" class="search-form">
                        <input type="search" name="q" id="search" placeholder="Search">
                    </form>
                    <div class="profile" hidden>
                        <div class="photo-profile">
                            <img src="assets/img.png" alt="photo">
                        </div>
                        <div class="info-profile">
                            <p class="name">Username</p>
                            <p class="role">member</p>
                        </div>
                    </div>
                    <a href="login.html" id="btn-login">Log in</a>
                </div>
            </header>
            <main class="main matches-page">
                <div class="match-filters">
                    <input id="match-search" type="search" placeholder="Search matches..." aria-label="Search matches">

                    <select id="match-season" aria-label="Season"></select>

                    <select id="match-team" aria-label="Team">
                        <option value="">All teams</option>
                    </select>

                    <div class="match-tabs" role="group" aria-label="เลือกประเภทแมตช์">
                        <input type="hidden" id="match-status" value="">

                        <button type="button" data-status="" aria-pressed="true">
                            All
                        </button>

                        <button type="button" data-status="scheduled" aria-pressed="false">
                            Upcoming
                        </button>

                        <button type="button" data-status="completed" aria-pressed="false">
                            Completed
                        </button>
                    </div>
                </div>

                <p id="match-message" role="status">กำลังโหลดแมตช์...</p>
                <button id="match-retry" type="button" hidden>ลองอีกครั้ง</button>

                <div class="matches-scroll">
                    <table class="matches-table">
                        
                        <thead>
                            <tr>
                                <th scope="col">Date</th>
                                <th scope="col">Home team</th>
                                <th scope="col">Score</th>
                                <th scope="col">Away team</th>
                                <th scope="col">status</th>
                                <th scope="col">Details</th>
                            </tr>
                        </thead>
                        <tbody id="match-rows"></tbody>
                    </table>
                </div>

                <nav class="match-pagination" aria-label="Match pages">
                    <button id="match-prev" type="button" disabled>Previous</button>
                    <span id="match-page" aria-live="polite"></span>
                    <button id="match-next" type="button" disabled>Next</button>
                </nav>

                <dialog id="match-dialog" aria-labelledby="match-detail-title">
                    <h2 id="match-detail-title"></h2>
                    <p id="match-detail-info"></p>

                    <table class="match-stats">
                        <thead>
                            <tr>
                                <th scope="col">Home team</th>
                                <th scope="col">Statistics</th>
                                <th scope="col">Away team</th>
                            </tr>
                        </thead>
                        <tbody id="match-detail-stats"></tbody>
                    </table>

                    <form method="dialog">
                        <button type="submit">Close</button>
                    </form>
                </dialog>
            </main>

        </div>

    </div>
</body>

</html>
